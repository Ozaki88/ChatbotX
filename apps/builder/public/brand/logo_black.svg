<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4300 1024">
<g>  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86A986"/>
      <stop offset="1" stop-color="#3B5E44"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A646"/>
      <stop offset="1" stop-color="#F8D888"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- paper plane: top wing, lower wing, keel -->
  <path d="M190 470 L840 220 L455 590 Z" fill="#FFFDF7"/>
  <path d="M455 590 L840 220 L620 800 Z" fill="#E4ECE2"/>
  <path d="M455 590 L540 650 L500 760 Z" fill="#B9CCB9"/>
  <!-- motion trail -->
  <path d="M170 640 C 260 610, 330 640, 400 700" stroke="#FFFDF7" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M130 730 C 230 700, 300 735, 360 790" stroke="#FFFDF7" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- sage leaf with stem -->
  <g transform="translate(255 845) rotate(-38)">
    <path d="M0 0 C 60 -78, 190 -92, 300 0 C 190 92, 60 78, 0 0 Z" fill="url(#leaf)"/>
    <path d="M-40 0 L 280 0" stroke="#A8641F" stroke-width="9" stroke-linecap="round"/>
    <path d="M80 0 L 120 -38 M150 0 L 190 -40 M80 0 L 120 38 M150 0 L 190 40" stroke="#A8641F" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g></g>
<text x="1200" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="600" fill="#1F2A22">Freya Sage</text>
</svg>
